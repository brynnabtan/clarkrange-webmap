<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYnJ5bm5hYnRhbiIsImEiOiJjbXJjNGZvdXgwMG5vMzBxM3JpYXRoZXN3In0.4G5a69c71gdjvW80QexbwA';
    
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/brynnabtan/cmqf4c9o300ba01s3at7x556r',
        center: [-84.954, 36.210],
        zoom: 15.11
    });

    // --- 1. GLOBAL TOGGLE FUNCTIONS (Must be outside map.on('load')) ---
    
    function toggleLayer(layerId, checkboxElement) {
        if (!map.getLayer(layerId)) {
            console.warn(`Layer not found: ${layerId}`);
            return;
        }
        map.setLayoutProperty(layerId, 'visibility', checkboxElement.checked ? 'visible' : 'none');
    }

    function toggleGroup(layerIds, checkboxElement) {
        layerIds.forEach(id => {
            if (map.getLayer(id)) {
                map.setLayoutProperty(id, 'visibility', checkboxElement.checked ? 'visible' : 'none');
            }
        });
    }

    function toggleSubLayer(layerId, checkboxElement) {
        if (!map.getLayer(layerId)) {
            console.warn(`Layer not found: ${layerId}`);
            return;
        }

        map.setLayoutProperty(layerId, 'visibility', checkboxElement.checked ? 'visible' : 'none');

        // Sync master checkbox and outline
        const subCheckboxes = document.querySelectorAll('.sub-soil-chk');
        const masterCheckbox = document.getElementById('chk-mapped-soil-units');
        if (subCheckboxes.length && masterCheckbox) {
            const anyChecked = Array.from(subCheckboxes).some(cb => cb.checked);
            const allChecked = Array.from(subCheckboxes).every(cb => cb.checked);
            masterCheckbox.checked = anyChecked;
            masterCheckbox.indeterminate = anyChecked && !allChecked;

            if (map.getLayer('grouped-polygons-outline')) {
                map.setLayoutProperty('grouped-polygons-outline', 'visibility', anyChecked ? 'visible' : 'none');
            }
        }
    }

    function toggleMasterSoil(masterElement) {
        const isChecked = masterElement.checked;
        masterElement.indeterminate = false;

        document.querySelectorAll('.sub-soil-chk').forEach(cb => {
            cb.checked = isChecked;
        });

        const allSoilLayerIds = [
            'soil-tilsit', 'soil-hartsells', 'soil-setback', 'soil-ramsey',
            'soil-lily', 'soil-slope', 'soil-lilyu', 'soil-unmapped',
            'grouped-polygons-outline'
        ];

        allSoilLayerIds.forEach(id => {
            if (map.getLayer(id)) {
                map.setLayoutProperty(id, 'visibility', isChecked ? 'visible' : 'none');
            }
        });
    }

    // --- 2. MAP LOAD EVENT ---
    map.on('load', () => {

        // Source registration (adjust path if needed)
        if (!map.getSource('soil-zones')) {
            map.addSource('soil-zones', {
                type: 'geojson',
                data: './soil_zones.geojson'
            });
        }

        const soilUnits = [
            { id: 'soil-tilsit', name: 'Tilsit', color: '#8fc492' },
            { id: 'soil-hartsells', name: 'Hartsells', color: '#5e9474' },
            { id: 'soil-setback', name: 'Setback', color: '#a6c9e2' },
            { id: 'soil-ramsey', name: 'Ramsey', color: '#a85f65' },
            { id: 'soil-lily', name: 'Lily', color: '#a8b86d' },
            { id: 'soil-slope', name: 'Slope', color: '#ad3640' },
            { id: 'soil-lilyu', name: 'LilyU', color: '#d4a080' },
            { id: 'soil-unmapped', name: 'Unmapped', color: '#d9d9d9' }
        ];

        // Add sub-layers
        soilUnits.forEach(unit => {
            if (!map.getLayer(unit.id)) {
                map.addLayer({
                    id: unit.id,
                    type: 'fill',
                    source: 'soil-zones',
                    filter: ['==', ['get', 'group'], unit.name],
                    paint: {
                        'fill-color': unit.color,
                        'fill-opacity': 0.6
                    }
                });
            }
        });

        // Add outline
        if (!map.getLayer('grouped-polygons-outline')) {
            map.addLayer({
                id: 'grouped-polygons-outline',
                type: 'line',
                source: 'soil-zones',
                paint: {
                    'line-color': '#333333',
                    'line-width': 1.0
                }
            });
        }

        // Hover configurations
        const hoverConfigs = [
            { layerId: '25ft Buffer Around Water Bodies', stateKey: 'Highlight Color Water' },
            { layerId: 'Drone Images', stateKey: 'Highlight Color Drone' },
            { layerId: 'Sub-Optimal Soil Area', stateKey: 'Highlight Color Sub-Opt SA' },
            { layerId: 'Hydric Soil Area', stateKey: 'Highlight Color Hydric SA' },
            { layerId: 'Test Soil Area', stateKey: 'Highlight Color Test SA' }
        ];

        const activeFeatures = {};

        hoverConfigs.forEach(config => {
            if (!map.getLayer(config.layerId)) return;

            map.on('mousemove', config.layerId, (e) => {
                if (!e.features.length) return;
                const prev = activeFeatures[config.layerId];
                const current = e.features[0];

                if (prev) {
                    map.setFeatureState(
                        { source: prev.source, sourceLayer: prev.sourceLayer, id: prev.id },
                        { [config.stateKey]: false }
                    );
                }

                map.setFeatureState(
                    { source: current.source, sourceLayer: current.sourceLayer, id: current.id },
                    { [config.stateKey]: true }
                );

                activeFeatures[config.layerId] = current;
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', config.layerId, () => {
                const prev = activeFeatures[config.layerId];
                if (prev) {
                    map.setFeatureState(
                        { source: prev.source, sourceLayer: prev.sourceLayer, id: prev.id },
                        { [config.stateKey]: false }
                    );
                }
                activeFeatures[config.layerId] = null;
                map.getCanvas().style.cursor = '';
            });
        });

        // Popup clicks
        const vectorLayers = [
            'soil-tilsit', 'soil-hartsells', 'soil-setback', 'soil-ramsey',
            'soil-lily', 'soil-slope', 'soil-lilyu', 'soil-unmapped',
            'Test Soil Area', 'Hydric Soil Area', 'Sub-Optimal Soil Area',
            '25ft Buffer Around Water Bodies', 'Water Body', 'Boulder',
            'Property Boundary', 'Surrounding Parcels', 'Stream'
        ];

        vectorLayers.forEach(layerId => {
            if (map.getLayer(layerId)) {
                map.on('click', layerId, (e) => {
                    const props = e.features[0].properties;
                    let html = `<h3>${layerId}</h3><table class="popup-table">`;
                    for (const [k, v] of Object.entries(props)) {
                        html += `<tr><td>${k}</td><td>${v}</td></tr>`;
                    }
                    html += `</table>`;
                    new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
                });
            }
        });

        // Drone imagery clicks
        const droneDisplayNames = ['Drone Images', 'Highlighted Drone Images of Sub-Optimal Soil Area'];
        droneDisplayNames.forEach(displayName => {
            if (map.getLayer(displayName)) {
                map.on('click', displayName, (e) => {
                    const props = e.features[0].properties;
                    const imageUrl = props.PhotoURL_1;
                    
                    let html = `<h3>Drone Imagery</h3>`;
                    if (imageUrl) {
                        html += `<img src="${imageUrl}" style="width:100%; height:auto; border-radius:4px; margin-bottom:8px;">`;
                    } else {
                        html += `<p>No image available for this location.</p>`;
                    }

                    new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
                });

                map.on('mouseenter', displayName, () => map.getCanvas().style.cursor = 'pointer');
                map.on('mouseleave', displayName, () => map.getCanvas().style.cursor = '');
            }
        });

    }); // <-- EXACT CLOSE for map.on('load')

    // --- 3. LEGEND ACCORDION HANDLER ---
    const legendHeader = document.getElementById('legend-header');
    if (legendHeader) {
        legendHeader.addEventListener('click', () => {
            const content = document.getElementById('legend-content');
            const isCollapsed = content.classList.toggle('collapsed');
            legendHeader.textContent = isCollapsed ? 'Legend ▲' : 'Legend ▼';
        });
    }
</script>
