<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Clarkrange Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; }
        .mapboxgl-popup { max-width: 350px !important; }
        .popup-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 11px; margin-top: 8px; }
        .popup-table th, .popup-table td { padding: 5px 6px; text-align: left; border-bottom: 1px solid #ddd; }
        .popup-table th { background-color: #f4f4f4; font-weight: bold; color: #333; }
        .popup-table tr:nth-child(even) { background-color: #fafafa; }
        .map-legend { position: absolute; bottom: 30px; right: 10px; z-index: 1; background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.4); font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 18px; color: #333; max-width: 240px; max-height: 85vh; overflow-y: auto; }
        .legend-title { font-weight: bold; margin-bottom: 6px; font-size: 13px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .legend-section { font-weight: bold; font-size: 10px; text-transform: uppercase; color: #777; margin-top: 8px; margin-bottom: 4px; }
        .toggle-item { display: flex; align-items: center; margin-bottom: 4px; cursor: pointer; }
        .toggle-item input { margin-right: 8px; cursor: pointer; }
        .legend-key { display: inline-block; width: 16px; height: 16px; margin-right: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
        .legend-key.line { height: 3px; border-radius: 0; }
        .legend-key.point { border-radius: 50%; width: 10px; height: 10px; margin-left: 3px; margin-right: 11px; }
        .legend-key.raster-box { width: 14px; height: 14px; border: 1px dashed #555; background: repeating-linear-gradient(45deg, #ccc, #ccc 2px, #fff 2px, #fff 4px); }
        .legend-key.caret { background: none !important; border: none !important; font-weight: bold; font-size: 16px; line-height: 16px; text-align: center; color: #000000; margin-right: 8px; }


        #legend-header {
    cursor: pointer;
    user-select: none;
}

#legend-content {
    transition: max-height 0.25s ease-out;
    overflow: hidden;
    max-height: 600px;
}

#legend-content.collapsed {
    max-height: 0;
    padding: 0;
}

#company-logo {
    position: absolute;
    top: 10px;      /* moved from bottom → top */
    left: 10px;     /* stays left */
    z-index: 10;
}

#company-logo img {
    width: 180px;      /* adjust size as needed */
    height: auto;
    object-fit: contain;
    opacity: 0.95;
}


#map-title {
    position: absolute;
    top: 20px;              /* aligns nicely with the logo */
    left: 200px;            /* moves the title to the right of the logo */
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #333;
    background: rgba(255, 255, 255, 0.85);
    padding: 6px 12px;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    z-index: 10;
}

    </style>
</head>
<body>
<div id="map"></div>

<div id="company-logo">
    <img src="https://i.imgur.com/I3uxPiA.jpg">
</div>

<div id="map-title">
    Clarkrange Regional Business Park – Soil Mapping Project: Deliverable I
</div>



<div id="legend" class="map-legend">
    <div id="legend-header" class="legend-title">Legend ▼</div>

    <!-- EVERYTHING collapses inside this wrapper -->
    <div id="legend-content">

        <div class="legend-section">Background Imagery</div>
<label class="toggle-item">
    <input type="checkbox"
           id="chk-ortho"
           checked
           onchange="toggleLayer('UAV-Derived Orthomosaic - 04-24-2026', this)">
    <span class="legend-key raster-box"></span>Drone Orthomosaic
</label>

<label class="toggle-item">
    <input type="checkbox"
           id="chk-dsm"
           checked
           onchange="toggleLayer('UAV-Derived Digital Surface Model - 04-24-2026', this)">
    <span class="legend-key raster-box"></span>Digital Surface Model (DSM)
</label>


        <div class="legend-section">Soil Assessment</div>
        <label class="toggle-item"><input type="checkbox" id="chk-test-soil" checked onchange="toggleLayer('UAV-Derived Test Soil Area - 04-24-2026', this)"><span class="legend-key" style="background-color: #23852a;"></span>Test Soil Area</label>
        <label class="toggle-item"><input type="checkbox" id="chk-hydric-soil" checked onchange="toggleLayer('UAV-Derived Hydric Soil Area - 04-24-2026', this)"><span class="legend-key" style="background-color: #53ccff;"></span>Hydric Soil Area</label>
        <label class="toggle-item"><input type="checkbox" id="chk-suboptimal-soil" checked onchange="toggleLayer('UAV-Derived Sub-Optimal Soil Area - 04-24-2026', this)"><span class="legend-key" style="background-color: #bb35b6;"></span>Sub-Optimal Soil Area</label>

        <div class="legend-section">Environmental & Boundaries</div>
        <label class="toggle-item"><input type="checkbox" id="chk-property" checked onchange="toggleLayer('UAV-Derived Property Boundary - 04-24-2026', this)"><span class="legend-key line" style="background-color: #000000;"></span>Property Boundary</label>
        <label class="toggle-item"><input type="checkbox" id="chk-stream" checked onchange="toggleLayer('UAV-Derived Stream - 04-24-2026', this)"><span class="legend-key line" style="background-color: #017bf2;"></span>Stream</label>
        <label class="toggle-item"><input type="checkbox" id="chk-buffer" checked onchange="toggleLayer('UAV-Derived 25ft Buffer Around Water Bodies - 04-24-2026', this)"><span class="legend-key" style="background-color: #54a2cf; opacity: 0.4;"></span>25ft Water Buffer</label>
        <label class="toggle-item"><input type="checkbox" id="chk-waterbody" checked onchange="toggleLayer('UAV-Derived Water Body - 04-24-2026', this)"><span class="legend-key" style="background-color: #5da8fe;"></span>Water Body</label>
        <label class="toggle-item"><input type="checkbox" id="chk-contours" checked onchange="toggleGroup(['UAV-Derived 5ft Interval Contours - 04-24-2026', 'UAV-Derived Contour Labels - 04-24-2026'], this)"><span class="legend-key line" style="background-color: #000000;"></span>5ft Interval Contours</label>
        <label class="toggle-item"><input type="checkbox" id="chk-parcels" checked onchange="toggleLayer('UAV-Derived Surrounding Parcels - 04-24-2026', this)"><span class="legend-key line" style="background-color: #ffffff; border-style: dashed;"></span>Surrounding Parcels</label>
        <label class="toggle-item"><input type="checkbox" id="chk-boulder" checked onchange="toggleLayer('UAV-Derived Boulder - 04-24-2026', this)"><span class="legend-key caret">^</span>Boulder</label>

        <div class="legend-section">Survey Imagery</div>
        <label class="toggle-item">
    <input type="checkbox"
           id="chk-drone-images"
           checked
           onchange="toggleLayer('Drone Images', this)">
    <span class="legend-key point" style="background-color:#000;"></span>
    Drone Images
</label>


    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiYnJ5bm5hYnRhbiIsImEiOiJjbXJjNGZvdXgwMG5vMzBxM3JpYXRoZXN3In0.4G5a69c71gdjvW80QexbwA';
        
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/brynnabtan/cmqf4c9o300ba01s3at7x556r',
            center: [-84.954, 36.210],
            zoom: 15.11
        });

       function toggleLayer(layerId, checkboxElement) {
    const visibility = checkboxElement.checked ? 'visible' : 'none';

    if (!map.getLayer(layerId)) {
        console.warn(`Layer not found: ${layerId}`);
        return;
    }

    map.setLayoutProperty(layerId, 'visibility', visibility);
}


        function toggleGroup(layerIds, checkboxElement) {
            layerIds.forEach(id => {
                if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', checkboxElement.checked ? 'visible' : 'none');
            });
        }

        map.on('load', () => {
            // Note: Rasters are NOT added via code here. 
            // Ensure they are ordered correctly in your Mapbox Studio style.

            // --- FIXED HOVER CONFIG (no more stuck highlights!) ---
const hoverConfigs = [
    { layerId: '25ft Buffer Around Water Bodies', stateKey: 'Highlight Color Water' },
    { layerId: 'Drone Images', stateKey: 'Highlight Color Drone' },
    { layerId: 'Sub-Optimal Soil Area', stateKey: 'Highlight Color Sub-Opt SA' },
    { layerId: 'Hydric Soil Area', stateKey: 'Highlight Color Hydric SA' },
    { layerId: 'Test Soil Area', stateKey: 'Highlight Color Test SA' }
];

// Track active feature *per layer* instead of globally
const activeFeatures = {};

hoverConfigs.forEach(config => {
    map.on('mousemove', config.layerId, (e) => {
        if (!e.features.length) return;

        const prev = activeFeatures[config.layerId];
        const current = e.features[0];

        // Turn OFF previous highlight for this layer
        if (prev) {
            map.setFeatureState(
                { source: prev.source, sourceLayer: prev.sourceLayer, id: prev.id },
                { [config.stateKey]: false }
            );
        }

        // Turn ON new highlight
        map.setFeatureState(
            { source: current.source, sourceLayer: current.sourceLayer, id: current.id },
            { [config.stateKey]: true }
        );

        activeFeatures[config.layerId] = current;
        map.getCanvas().style.cursor = 'pointer';
    });

    map.on('mouseleave', config.layerId, () => {
        const prev = activeFeatures[config.layerId];

        // Turn OFF highlight when leaving the layer
        if (prev) {
            map.setFeatureState(
                { source: prev.source, sourceLayer: prev.sourceLayer, id: prev.id },
                { [config.stateKey]: false }
            );
        }

        activeFeatures[config.layerId] = null;
        map.getCanvas().style.cursor = '';
    });
});


            // Click interaction
            const vectorLayers = ['Test Soil Area', 'Hydric Soil Area', 'Sub-Optimal Soil Area', '25ft Buffer Around Water Bodies', 'Water Body', 'Boulder', 'Property Boundary', 'Surrounding Parcels', 'Stream'];
            vectorLayers.forEach(layerId => {
                if (map.getLayer(layerId)) {
                    map.on('click', layerId, (e) => {
                        const props = e.features[0].properties;
                        let html = `<h3>${layerId}</h3><table class="popup-table">`;
                        for (const [k, v] of Object.entries(props)) html += `<tr><td>${k}</td><td>${v}</td></tr>`;
                        html += `</table>`;
                        new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
                    });
                }
            });
const droneDisplayNames = ['Drone Images', 'Highlighted Drone Images of Sub-Optimal Soil Area'];

            droneDisplayNames.forEach(displayName => {
                // Check if the layer exists in the map style
                if (map.getLayer(displayName)) {
                    map.on('click', displayName, (e) => {
                        const props = e.features[0].properties;
                        const imageUrl = props.PhotoURL_1; // Access your specific column name

                        // Build the HTML for the popup
                        let html = `<h3>Drone Imagery</h3>`;
                        
                        if (imageUrl) {
                            html += `<img src="${imageUrl}" style="width:100%; height:auto; border-radius:4px; margin-bottom:8px;">`;
                        } else {
                            html += `<p>No image available for this location.</p>`;
                        }

                        new mapboxgl.Popup()
                            .setLngLat(e.lngLat)
                            .setHTML(html)
                            .addTo(map);
                    });

                    // Maintain cursor interactivity
                    map.on('mouseenter', displayName, () => map.getCanvas().style.cursor = 'pointer');
                    map.on('mouseleave', displayName, () => map.getCanvas().style.cursor = '');
                }
            });
        });
document.getElementById('legend-header').addEventListener('click', () => {
    const content = document.getElementById('legend-content');
    const header = document.getElementById('legend-header');

    const isCollapsed = content.classList.toggle('collapsed');
    header.textContent = isCollapsed ? 'Legend ▲' : 'Legend ▼';
});

    </script>
</body>
</html>
