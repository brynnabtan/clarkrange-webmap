<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Clarkrange Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <!-- Mapbox GL JS Styles and Library MUST load here first -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; }
        .mapboxgl-popup { max-width: 350px !important; }
        .popup-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 11px; margin-top: 8px; }
        .popup-table th, .popup-table td { padding: 5px 6px; text-align: left; border-bottom: 1px solid #ddd; }
        .popup-table th { background-color: #f4f4f4; font-weight: bold; color: #333; }
        .popup-table tr:nth-child(even) { background-color: #fafafa; }
        .map-legend { position: absolute; bottom: 30px; right: 10px; z-index: 1; background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.4); font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 18px; color: #333; max-width: 250px; max-height: 85vh; overflow-y: auto; }
        .legend-title { font-weight: bold; margin-bottom: 6px; font-size: 13px; border-bottom: 1px solid #ddd; padding-bottom: 4px; cursor: pointer; user-select: none; }
        .legend-section { font-weight: bold; font-size: 10px; text-transform: uppercase; color: #777; margin-top: 8px; margin-bottom: 4px; }
        .toggle-item { display: flex; align-items: center; margin-bottom: 4px; cursor: pointer; }
        .toggle-item input { margin-right: 8px; cursor: pointer; }
        .legend-key { display: inline-block; width: 16px; height: 16px; margin-right: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
        .legend-key.line { height: 3px; border-radius: 0; }
        .legend-key.point { border-radius: 50%; width: 10px; height: 10px; margin-left: 3px; margin-right: 11px; }
        .legend-key.raster-box { width: 14px; height: 14px; border: 1px dashed #555; background: repeating-linear-gradient(45deg, #ccc, #ccc 2px, #fff 2px, #fff 4px); }
        .legend-key.caret { background: none !important; border: none !important; font-weight: bold; font-size: 16px; line-height: 16px; text-align: center; color: #000000; margin-right: 8px; }

        .sub-legend { margin-left: 20px; margin-bottom: 6px; border-left: 2px solid #ddd; padding-left: 8px; }
        .sub-legend-item { display: flex; align-items: center; margin-bottom: 3px; font-size: 11px; color: #444; }
        .sub-legend-key { width: 12px; height: 12px; margin-right: 6px; border-radius: 2px; flex-shrink: 0; }

        #legend-content { transition: max-height 0.25s ease-out; overflow: hidden; max-height: 700px; }
        #legend-content.collapsed { max-height: 0; padding: 0; }

        #company-logo { position: absolute; top: 10px; left: 10px; z-index: 10; }
        #company-logo img { width: 180px; height: auto; object-fit: contain; opacity: 0.95; }

        #map-title {
            position: absolute;
            top: 20px;
            left: 200px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #333;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="company-logo">
    <img src="https://i.imgur.com/I3uxPiA.jpg" alt="Company Logo">
</div>

<div id="map-title">
    Clarkrange Regional Business Park – Soil Mapping Project: Deliverable I
</div>

<div id="legend" class="map-legend">
    <div id="legend-header" class="legend-title">Legend ▼</div>

    <div id="legend-content">
        <div class="legend-section">Background Imagery</div>
        <label class="toggle-item">
            <input type="checkbox" id="chk-ortho" checked onchange="toggleLayer('UAV-Derived Orthomosaic - 04-24-2026', this)">
            <span class="legend-key raster-box"></span>Drone Orthomosaic
        </label>
        <label class="toggle-item">
            <input type="checkbox" id="chk-dsm" checked onchange="toggleLayer('UAV-Derived Digital Surface Model - 04-24-2026', this)">
            <span class="legend-key raster-box"></span>Digital Surface Model (DSM)
        </label>

        <div class="legend-section">Soil Assessment</div>
        <label class="toggle-item"><input type="checkbox" id="chk-test-soil" checked onchange="toggleLayer('Test Soil Area', this)"><span class="legend-key" style="background-color: #23852a;"></span>Test Soil Area</label>
        <label class="toggle-item"><input type="checkbox" id="chk-hydric-soil" checked onchange="toggleLayer('Hydric Soil Area', this)"><span class="legend-key" style="background-color: #53ccff;"></span>Hydric Soil Area</label>
        <label class="toggle-item"><input type="checkbox" id="chk-suboptimal-soil" checked onchange="toggleLayer('Sub-Optimal Soil Area', this)"><span class="legend-key" style="background-color: #bb35b6;"></span>Sub-Optimal Soil Area</label>

        <!-- Master Soil Units Toggle -->
<label class="toggle-item">
    <input type="checkbox" id="chk-mapped-soil-units" checked onchange="toggleMasterSoil(this)">
    <span class="legend-key" style="background: linear-gradient(135deg, #8fc492 25%, #5e9474 25% 50%, #a8b86d 50% 75%, #a85f65 75%);"></span>Mapped Soil Units
</label>

<!-- Individual Soil Unit Sub-Toggles -->
<div class="sub-legend">
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="Tilsit" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #8fc492;"></span>Tilsit
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="Alticrest" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #75ad79;"></span>Alticrest
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="Hartsells" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #5e9474;"></span>Hartsells
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="Lily" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #a8b86d;"></span>Lily
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="Ramsey" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #a85f65;"></span>Ramsey
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="Slope" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #ad3640;"></span>Slope
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="LilyU" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #d4a080;"></span>LilyU
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="AlticrestU" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #c97878;"></span>AlticrestU
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="Setback" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #a6c9e2;"></span>Setback
    </label>
    <label class="toggle-item sub-legend-item">
        <input type="checkbox" class="sub-soil-chk" value="Unmapped" checked onchange="toggleSubLayer()">
        <span class="sub-legend-key" style="background-color: #d9d9d9;"></span>Unmapped
    </label>
</div>

        <div class="legend-section">Environmental & Boundaries</div>
        <label class="toggle-item"><input type="checkbox" id="chk-property" checked onchange="toggleLayer('Property Boundary', this)"><span class="legend-key line" style="background-color: #000000;"></span>Property Boundary</label>
        <label class="toggle-item"><input type="checkbox" id="chk-stream" checked onchange="toggleLayer('Stream', this)"><span class="legend-key line" style="background-color: #017bf2;"></span>Stream</label>
        <label class="toggle-item"><input type="checkbox" id="chk-buffer" checked onchange="toggleLayer('25ft Buffer Around Water Bodies', this)"><span class="legend-key" style="background-color: #54a2cf; opacity: 0.4;"></span>25ft Water Buffer</label>
        <label class="toggle-item"><input type="checkbox" id="chk-waterbody" checked onchange="toggleLayer('Water Body', this)"><span class="legend-key" style="background-color: #5da8fe;"></span>Water Body</label>
        <label class="toggle-item"><input type="checkbox" id="chk-contours" checked onchange="toggleGroup(['5ft Interval Contours', 'Contour Labels'], this)"><span class="legend-key line" style="background-color: #000000;"></span>5ft Interval Contours</label>
        <label class="toggle-item"><input type="checkbox" id="chk-parcels" checked onchange="toggleLayer('Surrounding Parcels', this)"><span class="legend-key line" style="background-color: #ffffff; border-style: dashed;"></span>Surrounding Parcels</label>
        <label class="toggle-item"><input type="checkbox" id="chk-boulder" checked onchange="toggleLayer('Boulder', this)"><span class="legend-key caret">^</span>Boulder</label>

        <div class="legend-section">Survey Imagery</div>
        <label class="toggle-item">
            <input type="checkbox" id="chk-drone-images" checked onchange="toggleLayer('Drone Images', this)">
            <span class="legend-key point" style="background-color:#000;"></span>Drone Images
        </label>
        <label class="toggle-item">
            <input type="checkbox" id="chk-drone-images-highlighted" checked onchange="toggleLayer('Highlighted Drone Images of Sub-Optimal Soil Area', this)">
            <span class="legend-key point" style="background-color:#FFD700; border: 1px solid #FF8C00;"></span>Highlighted Drone Images
        </label>
        <label class="toggle-item">
    <input type="checkbox" id="chk-soil-pits" checked onchange="toggleSoilPits(this)">
    <span class="legend-key point" style="background-color: #FFFFFF;"></span>Soil Pits
    </label>
    </div>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYnJ5bm5hYnRhbiIsImEiOiJjbXJjNGZvdXgwMG5vMzBxM3JpYXRoZXN3In0.4G5a69c71gdjvW80QexbwA';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/brynnabtan/cmqf4c9o300ba01s3at7x556r',
        center: [-84.954, 36.210],
        zoom: 15.11
    });

    // --- GLOBAL TOGGLE FUNCTIONS ---

    function toggleLayer(layerId, checkboxElement) {
        if (!map.getLayer(layerId)) {
            console.warn(`Layer not found: ${layerId}`);
            return;
        }
        map.setLayoutProperty(layerId, 'visibility', checkboxElement.checked ? 'visible' : 'none');
    }

    function toggleGroup(layerIds, checkboxElement) {
        layerIds.forEach(id => {
            if (map.getLayer(id)) {
                map.setLayoutProperty(id, 'visibility', checkboxElement.checked ? 'visible' : 'none');
            }
        });
    }

    // Some links are a folder URL with the file ID glued onto the end:
    //   https://drive.google.com/drive/folders/XXXX?usp=drive_link<FILE_ID>
    function getGluedFileId(raw) {
        const m = String(raw || '').trim().match(/\?usp=[a-z_]*drive_link([\w-]{20,})\s*$/i);
        return m ? m[1] : null;
    }

    // Turn whatever is stored in the photo field into a list of image URLs to try, best first
    function getImageCandidates(raw) {
        if (!raw) return [];
        let url = String(raw).trim();
        if (url.startsWith('[') || url.startsWith('{')) {   // JSON array/object stored as text
            try {
                const parsed = JSON.parse(url);
                url = Array.isArray(parsed) ? String(parsed[0]) : String(Object.values(parsed)[0]);
            } catch (err) { /* leave as is */ }
        }
        url = url.replace(/^http:\/\//i, 'https://');

        const gluedId = getGluedFileId(url);
        if (gluedId) {
            return [
                `https://drive.google.com/thumbnail?id=${gluedId}&sz=w1200`,
                `https://lh3.googleusercontent.com/d/${gluedId}=w1200`,
                `https://drive.google.com/uc?export=view&id=${gluedId}`
            ];
        }

        // Google Drive: file/d/ID, open?id=ID, uc?id=ID, or any ?id=ID on a google domain
        if (/google\.com|googleusercontent\.com/.test(url)) {
            const m = url.match(/\/d\/([\w-]{15,})/) || url.match(/[?&]id=([\w-]{15,})/);
            if (m) {
                const id = m[1];
                return [
                    `https://drive.google.com/thumbnail?id=${id}&sz=w1200`,
                    `https://lh3.googleusercontent.com/d/${id}=w1200`,
                    `https://drive.google.com/uc?export=view&id=${id}`
                ];
            }
        }
        if (/dropbox\.com/.test(url)) {
            url = url.replace(/[?&]dl=0/, '');
            url += (url.includes('?') ? '&' : '?') + 'raw=1';
        }
        const imgur = url.match(/^https:\/\/imgur\.com\/(\w+)$/);
        if (imgur) return [`https://i.imgur.com/${imgur[1]}.jpg`];
        try { return [encodeURI(decodeURI(url))]; } catch (err) { return [url]; }
    }

    // Called by an <img> when it fails: try the next candidate, otherwise show a link
    function imgFallback(img) {
        const alts = JSON.parse(decodeURIComponent(img.dataset.alts || '[]'));
        if (alts.length) {
            img.dataset.alts = encodeURIComponent(JSON.stringify(alts.slice(1)));
            img.src = alts[0];
            return;
        }
        const original = decodeURIComponent(img.dataset.original || '');
        const p = document.createElement('p');
        p.innerHTML = 'Image could not be loaded. Check that the file is shared as "Anyone with the link".<br>';
        const a = document.createElement('a');
        a.href = original; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open original link';
        p.appendChild(a);
        img.replaceWith(p);
    }

    // Optional: paste a Google Drive API key here to show every image in a Drive FOLDER link.
    // (Enable the Drive API in Google Cloud Console; restrict the key to your site's URL.)
    const DRIVE_API_KEY = '';

    function getDriveFolderId(raw) {
        const s = String(raw || '');
        if (getGluedFileId(s)) return null; // actually a file link, not a folder
        const m = s.match(/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/) || s.match(/folderview\?id=([\w-]+)/);
        return m ? m[1] : null;
    }

    // Fills any folder placeholder in a popup with the folder's images
    async function loadFolderPhotos(root) {
        if (!root) return;
        const box = root.querySelector('.folder-photos');
        if (!box) return;
        const folderId = box.dataset.folder;
        const folderLink = `https://drive.google.com/drive/folders/${folderId}`;
        if (!DRIVE_API_KEY) {
            box.innerHTML = `<p>This pit links to a Drive <b>folder</b>, not an image file.<br>
                <a href="${folderLink}" target="_blank" rel="noopener">Open folder</a></p>`;
            return;
        }
        try {
            const q = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'image/' and trashed=false`);
            const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=name&pageSize=20&key=${DRIVE_API_KEY}`);
            const data = await res.json();
            if (!data.files || !data.files.length) {
                box.innerHTML = `<p>No images found in this folder (is it shared as "Anyone with the link"?).<br>
                    <a href="${folderLink}" target="_blank" rel="noopener">Open folder</a></p>`;
                return;
            }
            box.innerHTML = '';
            data.files.forEach(f => {
                const img = document.createElement('img');
                img.referrerPolicy = 'no-referrer';
                img.title = f.name;
                img.style.cssText = 'width:100%; height:auto; border-radius:4px; margin-bottom:8px;';
                img.dataset.alts = encodeURIComponent(JSON.stringify([`https://lh3.googleusercontent.com/d/${f.id}=w1200`]));
                img.dataset.original = encodeURIComponent(`https://drive.google.com/file/d/${f.id}/view`);
                img.onerror = () => imgFallback(img);
                img.src = `https://drive.google.com/thumbnail?id=${f.id}&sz=w1200`;
                box.appendChild(img);
            });
        } catch (err) {
            console.warn('Drive folder lookup failed:', err);
            box.innerHTML = `<p>Could not load folder images.<br><a href="${folderLink}" target="_blank" rel="noopener">Open folder</a></p>`;
        }
    }

    function buildImageHtml(raw) {
        const folderId = getDriveFolderId(raw);
        if (folderId) return `<div class="folder-photos" data-folder="${folderId}">Loading photos…</div>`;
        const urls = getImageCandidates(raw);
        if (!urls.length) return `<p>No image available for this location.</p>`;
        console.log('Photo raw value:', raw, '-> candidates:', urls);
        return `<img src="${urls[0]}" referrerpolicy="no-referrer"
                     data-alts="${encodeURIComponent(JSON.stringify(urls.slice(1)))}"
                     data-original="${encodeURIComponent(String(raw).trim())}"
                     onerror="imgFallback(this)"
                     style="width:100%; height:auto; border-radius:4px; margin-bottom:8px;">`;
    }

    // Find the soil pits layer no matter how it is named in Mapbox Studio
    // (e.g. 'soil-pits-with-images' or 'Soil Pits with Images')
    function getSoilPitLayerId() {
        const exact = ['soil-pits-with-images', 'Soil Pits with Images'].find(id => map.getLayer(id));
        if (exact) return exact;
        const layers = (map.getStyle() && map.getStyle().layers) || [];
        const guess = layers.find(l => /soil[\s_-]*pits?/i.test(l.id));
        return guess ? guess.id : null;
    }

    function toggleSoilPits(checkboxElement) {
        const id = getSoilPitLayerId();
        if (!id) { console.warn('Soil pits layer not found'); return; }
        map.setLayoutProperty(id, 'visibility', checkboxElement.checked ? 'visible' : 'none');
    }

    // Target layer name from Mapbox Studio
let SOIL_LAYER_ID = 'mapped-soil-units'; // auto-resolved on load (also matches 'Mapped Soil Units')

// Find the soil units layer however it is spelled in the style
function getSoilLayerId() {
    const exact = ['mapped-soil-units', 'Mapped Soil Units'].find(id => map.getLayer(id));
    if (exact) return exact;
    const layers = (map.getStyle() && map.getStyle().layers) || [];
    const guess = layers.find(l => /mapped[\s_-]*soil/i.test(l.id));
    return guess ? guess.id : null;
}

// The property column in your vector data (change 'group' if your attribute is named differently)
let SOIL_PROPERTY_KEY = 'group'; // auto-corrected on load if the data uses a different field

// Master toggle: shows/hides all or resets filter
function toggleMasterSoil(masterElement) {
    const isChecked = masterElement.checked;
    masterElement.indeterminate = false;

    // Check or uncheck all sub-boxes
    document.querySelectorAll('.sub-soil-chk').forEach(cb => {
        cb.checked = isChecked;
    });

    if (!map.getLayer(SOIL_LAYER_ID)) return;

    if (isChecked) {
        map.setLayoutProperty(SOIL_LAYER_ID, 'visibility', 'visible');
        map.setFilter(SOIL_LAYER_ID, null); // Clear filter to show all
    } else {
        map.setLayoutProperty(SOIL_LAYER_ID, 'visibility', 'none');
    }
}

// Sub-toggle: dynamically builds an 'in' filter for checked items
function toggleSubLayer() {
    if (!map.getLayer(SOIL_LAYER_ID)) {
        console.warn(`Layer "${SOIL_LAYER_ID}" not found in Mapbox style.`);
        return;
    }

    // Collect values from all checked sub-items
    const checkedValues = [];
    document.querySelectorAll('.sub-soil-chk').forEach(cb => {
        if (cb.checked) {
            checkedValues.push(cb.value);
        }
    });

    const masterCheckbox = document.getElementById('chk-mapped-soil-units');
    const totalCount = document.querySelectorAll('.sub-soil-chk').length;

    if (checkedValues.length === 0) {
        // Nothing selected: hide the layer completely
        map.setLayoutProperty(SOIL_LAYER_ID, 'visibility', 'none');
        if (masterCheckbox) {
            masterCheckbox.checked = false;
            masterCheckbox.indeterminate = false;
        }
    } else {
        // At least one selected: make visible and filter by checked names
        map.setLayoutProperty(SOIL_LAYER_ID, 'visibility', 'visible');
        map.setFilter(SOIL_LAYER_ID, ['in', ['get', SOIL_PROPERTY_KEY], ['literal', checkedValues]]);

        if (masterCheckbox) {
            masterCheckbox.checked = checkedValues.length === totalCount;
            masterCheckbox.indeterminate = checkedValues.length > 0 && checkedValues.length < totalCount;
        }
    }
}

    // --- MAP ON LOAD ---

    map.on('load', () => {
        console.log('All layer ids:', map.getStyle().layers.map(l => l.id));
        SOIL_LAYER_ID = getSoilLayerId() || SOIL_LAYER_ID;
        console.log('Soil units layer id:', SOIL_LAYER_ID, '| exists:', !!map.getLayer(SOIL_LAYER_ID));
        const soilPitLayer = getSoilPitLayerId();
        console.log('Soil pits layer id:', soilPitLayer);

        // Soil unit outline: only added if it isn't already in the style.
        // Reads source / source-layer from the style definition of the soil layer.
        try {
            const soilDef = map.getStyle().layers.find(l => l.id === SOIL_LAYER_ID);
            if (soilDef && !map.getLayer('grouped-polygons-outline')) {
                const outline = {
                    id: 'grouped-polygons-outline',
                    type: 'line',
                    source: soilDef.source,
                    paint: { 'line-color': '#333333', 'line-width': 1.0 }
                };
                if (soilDef['source-layer']) outline['source-layer'] = soilDef['source-layer'];
                map.addLayer(outline, soilPitLayer || undefined);
            }
        } catch (err) {
            console.warn('Could not add soil outline layer (skipping):', err);
        }

        // Layer order: put soil units (and outline) above the ortho + DSM, below everything else
        try {
            const rasterIds = [
                'UAV-Derived Orthomosaic - 04-24-2026',
                'UAV-Derived Digital Surface Model - 04-24-2026'
            ];
            const movable = [SOIL_LAYER_ID, 'grouped-polygons-outline'];
            const order = map.getStyle().layers.map(l => l.id);
            const topRaster = Math.max(...rasterIds.map(id => order.indexOf(id)));
            if (topRaster >= 0 && map.getLayer(SOIL_LAYER_ID)) {
                // First layer above the rasters that is not one of the layers being moved
                const beforeId = order.slice(topRaster + 1).find(id => !movable.includes(id));
                movable.forEach(id => {
                    if (map.getLayer(id)) map.moveLayer(id, beforeId); // undefined beforeId = top of stack
                });
            }
        } catch (err) {
            console.warn('Could not reorder soil layers:', err);
        }

        // Diagnose / auto-detect the soil units layer once tiles have rendered
        map.once('idle', () => {
            if (!map.getLayer(SOIL_LAYER_ID)) {
                console.warn(`[soil] layer "${SOIL_LAYER_ID}" not found`);
                return;
            }
            const feats = map.queryRenderedFeatures({ layers: [SOIL_LAYER_ID] });
            console.log('[soil] visibility:', map.getLayoutProperty(SOIL_LAYER_ID, 'visibility'),
                        '| filter:', JSON.stringify(map.getFilter(SOIL_LAYER_ID)),
                        '| features rendered:', feats.length);
            if (!feats.length) {
                console.warn('[soil] nothing rendered: layer is hidden, filtered out, or outside its zoom range');
                return;
            }
            const legendVals = new Set([...document.querySelectorAll('.sub-soil-chk')].map(cb => cb.value));
            let bestKey = SOIL_PROPERTY_KEY, bestHits = -1;
            Object.keys(feats[0].properties).forEach(k => {
                const hits = feats.filter(f => legendVals.has(String(f.properties[k]))).length;
                if (hits > bestHits) { bestHits = hits; bestKey = k; }
            });
            if (bestHits > 0 && bestKey !== SOIL_PROPERTY_KEY) {
                console.log(`[soil] using property "${bestKey}" instead of "${SOIL_PROPERTY_KEY}"`);
                SOIL_PROPERTY_KEY = bestKey;
            }
            const distinct = [...new Set(feats.map(f => f.properties[SOIL_PROPERTY_KEY]))];
            console.log(`[soil] values in "${SOIL_PROPERTY_KEY}":`, distinct,
                        '| not in legend:', distinct.filter(v => !legendVals.has(String(v))));
        });

        // Hover configs
        const hoverConfigs = [
            { layerId: '25ft Buffer Around Water Bodies', stateKey: 'Highlight Color Water' },
            { layerId: 'Drone Images', stateKey: 'Highlight Color Drone' },
            { layerId: 'Sub-Optimal Soil Area', stateKey: 'Highlight Color Sub-Opt SA' },
            { layerId: 'Hydric Soil Area', stateKey: 'Highlight Color Hydric SA' },
            { layerId: 'Test Soil Area', stateKey: 'Highlight Color Test SA' },
            { layerId: soilPitLayer, stateKey: 'Highlight Color Soil Pits' }
        ];

        const activeFeatures = {};

        hoverConfigs.forEach(config => {
            if (!config.layerId || !map.getLayer(config.layerId)) return;

            map.on('mousemove', config.layerId, (e) => {
                if (!e.features.length) return;
                const prev = activeFeatures[config.layerId];
                const current = e.features[0];

                if (prev) {
                    map.setFeatureState(
                        { source: prev.source, sourceLayer: prev.sourceLayer, id: prev.id },
                        { [config.stateKey]: false }
                    );
                }

                map.setFeatureState(
                    { source: current.source, sourceLayer: current.sourceLayer, id: current.id },
                    { [config.stateKey]: true }
                );

                activeFeatures[config.layerId] = current;
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', config.layerId, () => {
                const prev = activeFeatures[config.layerId];
                if (prev) {
                    map.setFeatureState(
                        { source: prev.source, sourceLayer: prev.sourceLayer, id: prev.id },
                        { [config.stateKey]: false }
                    );
                }
                activeFeatures[config.layerId] = null;
                map.getCanvas().style.cursor = '';
            });
        });

        // Popup clicks
const vectorLayers = [
    SOIL_LAYER_ID, // resolved above
    'Test Soil Area',
    'Hydric Soil Area',
    'Sub-Optimal Soil Area',
    '25ft Buffer Around Water Bodies',
    'Water Body',
    'Boulder',
    'Property Boundary',
    'Surrounding Parcels',
    'Stream'
];

        vectorLayers.forEach(layerId => {
            if (map.getLayer(layerId)) {
                map.on('click', layerId, (e) => {
                    // Don't also open a polygon popup if a pit/drone point was clicked
                    const pointLayers = [soilPitLayer, 'Drone Images', 'Highlighted Drone Images of Sub-Optimal Soil Area']
                        .filter(l => l && map.getLayer(l));
                    if (pointLayers.length && map.queryRenderedFeatures(e.point, { layers: pointLayers }).length) return;

                    const props = e.features[0].properties;
                    let html = `<h3>${layerId}</h3><table class="popup-table">`;
                    for (const [k, v] of Object.entries(props)) {
                        html += `<tr><td>${k}</td><td>${v}</td></tr>`;
                    }
                    html += `</table>`;
                    new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
                });
            }
        });

        // Drone imagery clicks
        const droneDisplayNames = ['Drone Images', 'Highlighted Drone Images of Sub-Optimal Soil Area'];
        droneDisplayNames.forEach(displayName => {
            if (map.getLayer(displayName)) {
                map.on('click', displayName, (e) => {
                    const props = e.features[0].properties;
                    const imageUrl = props.PhotoURL_1;
                    
                    let html = `<h3>Drone Imagery</h3>`;
                    if (imageUrl) {
                        html += `<img src="${imageUrl}" style="width:100%; height:auto; border-radius:4px; margin-bottom:8px;">`;
                    } else {
                        html += `<p>No image available for this location.</p>`;
                    }

                    new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
                });

                map.on('mouseenter', displayName, () => map.getCanvas().style.cursor = 'pointer');
                map.on('mouseleave', displayName, () => map.getCanvas().style.cursor = '');
            }
        });

        // Soil Pits imagery clicks (must live inside map.on('load') so the layer exists)
        if (soilPitLayer) {
            map.on('click', soilPitLayer, (e) => {
                const props = e.features[0].properties;
                // Use PhotoURL_1 if present, otherwise any property that looks like a photo/image URL
                let imageUrl = props.PhotoURL_1;
                if (!imageUrl) {
                    const key = Object.keys(props).find(k => /photo|image|url/i.test(k) && props[k]);
                    if (key) imageUrl = props[key];
                }
                console.log('Soil pit clicked:', props);

                const html = `<h3>Soil Pit Inspection</h3>` + buildImageHtml(imageUrl);
                const popup = new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
                loadFolderPhotos(popup.getElement());
            });

            // Hover highlight: a glowing ring drawn around whichever pit is under the cursor.
            // Uses its own GeoJSON source, so it needs no feature IDs or Studio style settings.
            if (!map.getSource('soil-pit-hover')) {
                map.addSource('soil-pit-hover', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: [] }
                });
            }
            if (!map.getLayer('soil-pit-hover-ring')) {
                map.addLayer({
                    id: 'soil-pit-hover-ring',
                    type: 'circle',
                    source: 'soil-pit-hover',
                    paint: {
                        'circle-radius': 0,
                        'circle-color': '#FFFFFF',
                        'circle-opacity': 0.35,
                        'circle-blur': 0.6,
                        'circle-stroke-color': '#FFFFFF',
                        'circle-stroke-width': 2,
                        'circle-stroke-opacity': 0.9
                    }
                });
            }
            const hoverSrc = () => map.getSource('soil-pit-hover');
            const HALO_RADIUS = 12;       // final halo size (px)
            const POP_DURATION = 240;     // ms
            let hoveredKey = null;
            let popFrame = null;

            // ease-out-back: grows past its final size a touch, then settles (the "pop")
            const easeOutBack = (t) => {
                const c1 = 1.9, c3 = c1 + 1;
                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            };

            function popHalo() {
                cancelAnimationFrame(popFrame);
                const start = performance.now();
                const step = (now) => {
                    const t = Math.min((now - start) / POP_DURATION, 1);
                    const k = easeOutBack(t);
                    map.setPaintProperty('soil-pit-hover-ring', 'circle-radius', Math.max(HALO_RADIUS * k, 0));
                    map.setPaintProperty('soil-pit-hover-ring', 'circle-opacity', 0.35 * Math.min(t * 2, 1));
                    map.setPaintProperty('soil-pit-hover-ring', 'circle-stroke-opacity', 0.9 * Math.min(t * 2, 1));
                    if (t < 1) popFrame = requestAnimationFrame(step);
                };
                popFrame = requestAnimationFrame(step);
            }

            function clearPitHover() {
                cancelAnimationFrame(popFrame);
                hoveredKey = null;
                hoverSrc().setData({ type: 'FeatureCollection', features: [] });
                map.setPaintProperty('soil-pit-hover-ring', 'circle-radius', 0);
            }

            map.on('mousemove', soilPitLayer, (e) => {
                if (!e.features.length) return;
                map.getCanvas().style.cursor = 'pointer';
                const geom = e.features[0].geometry;
                const key = JSON.stringify(geom.coordinates);
                if (key === hoveredKey) return;   // same pit: don't restart the pop
                hoveredKey = key;
                hoverSrc().setData({
                    type: 'FeatureCollection',
                    features: [{ type: 'Feature', properties: {}, geometry: geom }]
                });
                popHalo();
            });
            map.on('mouseleave', soilPitLayer, () => {
                map.getCanvas().style.cursor = '';
                clearPitHover();
            });
        } else {
            console.warn('Soil pits layer not found - check the layer name in Mapbox Studio');
        }

    });

    // Accordion toggle
    const legendHeader = document.getElementById('legend-header');
    if (legendHeader) {
        legendHeader.addEventListener('click', () => {
            const content = document.getElementById('legend-content');
            const isCollapsed = content.classList.toggle('collapsed');
            legendHeader.textContent = isCollapsed ? 'Legend ▲' : 'Legend ▼';
        });
    }
</script>
</body>
</html>
